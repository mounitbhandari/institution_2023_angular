<div class="container-fluid page">
  <div class="row d-flex align-items-center justify-content-between">
    <div class="col-12 header"><i class="bi bi-cash"></i>&nbsp; Fees Received</div>
  </div>
  <div class="row">
    <div class="col-8 mt-1 feeleft">

      <mat-tab-group (selectedIndexChange)="onTabChanged($event)" [(selectedIndex)]="selectedIndex"
        animationDuration="200ms" style="width:100% !important; ">
        <mat-tab>
          <ng-template mat-tab-label>
            <mat-icon class="example-tab-icon">trending_up</mat-icon>
            New Entry
          </ng-template>
          <form [formGroup]="PaymentFormGroup">
            <div class="p-3 flex-fill" style="background-color: white">

              <div class="row">
                <div class="col-sm-4">
                  <mat-form-field>
                    <mat-label>Payment Date</mat-label>
                    <input class="col-9" matInput #ref [matDatepicker]="transactionDate"
                      formControlName="transactionDate">
                    <mat-datepicker-toggle matSuffix [for]="transactionDate"></mat-datepicker-toggle>
                    <mat-datepicker #transactionDate></mat-datepicker>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-sm-4">
                  <!--  <ng-select [items]="paymentHeadArray" fxFlex="100" bindLabel="ledger_name" 
                        class="custom" bindValue="id" appendTo="body" formControlName="PaymentId"
                        placeholder="Payment Name"">
                      </ng-select> -->
                  <ng-select [items]="paymentHeadArray" class="custom" bindLabel="ledger_name"  bindValue="id" appendTo="body" formControlName="PaymentId"
                    placeholder="Payment Head">
                  </ng-select>
                </div>
              </div>

            </div>
          </form>
        </mat-tab>
      </mat-tab-group>
    </div>
  </div>
</div>
